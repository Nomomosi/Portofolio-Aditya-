<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4fbff" />
    <title>Aditya Sabde — CV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: light; font-family: "DM Sans", Arial, sans-serif; color: #292a39; background: #f4fbff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 28px; }
      .page { width: min(1180px, 100%); height: calc(100vh - 56px); height: calc(100dvh - 56px); margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 18px; }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .back { display: inline-flex; align-items: center; color: #292a39; text-decoration: none; font-size: 14px; font-weight: 600; }
      .back-icon { display: none; }
      .back:hover { color: #6040f5; }
      .download { display: inline-flex; min-height: 42px; align-items: center; justify-content: center; padding: 0 18px; border-radius: 6px; background: #6040f5; color: white; text-decoration: none; font-size: 14px; font-weight: 600; transition: background .2s ease; }
      .download:hover { background: #4d2ce1; }
      .viewer { display: block; width: 100%; height: 100%; min-height: 0; border: 1px solid #e4eaf0; border-radius: 10px; background: white; box-shadow: 0 8px 24px rgba(27, 39, 79, .08); }
      .fallback { padding: 24px; text-align: center; }
      .fallback a { color: #6040f5; }
      @media (max-width: 600px) { body { padding: 16px; } .page { height: calc(100vh - 32px); height: calc(100dvh - 32px); } .toolbar { align-items: center; flex-wrap: nowrap; } .back-label { display: none; } .back-icon { display: inline; font-size: 30px; line-height: 1; } .download { min-height: 36px; padding-inline: 11px; border-radius: 999px; font-size: 12px; } }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="toolbar">
        <a class="back" href="index.html#home" aria-label="Back to portfolio"><span class="back-icon" aria-hidden="true">‹</span><span class="back-label">← Back to portfolio</span></a>
        <a class="download" href="assets/cvaditya.pdf" download="Aditya-Sabde-CV.pdf">Download CV (PDF)</a>
      </header>
      <iframe class="viewer" src="assets/cvaditya.pdf#view=FitH" title="Aditya Sabde CV">
        <p class="fallback">Your browser can't preview this PDF. <a href="assets/cvaditya.pdf" download="Aditya-Sabde-CV.pdf">Download the CV</a>.</p>
      </iframe>
    </main>
  </body>
</html>
